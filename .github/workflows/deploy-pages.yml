name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "content/**"
      - "english/**"
      - "korean/**"
      - "scripts/build-content-index.py"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Keep the workflow harmless while the web app is still being assembled.
    if: hashFiles('apps/web/package.json', 'scripts/build-content-index.py') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        run: pnpm --dir apps/web install --no-frozen-lockfile

      - name: Build content catalog
        run: python3 scripts/build-content-index.py

      - name: Build Vite site
        run: pnpm --dir apps/web run build -- --base=/languages-docs/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
